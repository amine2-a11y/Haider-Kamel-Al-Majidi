	<pre id="console"></pre>
  <script>

/* Firmware Auto Start dispatcher */
(function () {
  "use strict";
  function fw() {
    var t = (document.body && document.body.innerText) || "";
    var m = t.match(/(9\.00|9\.03|9\.04|9\.50|9\.60|10\.00|10\.01|10\.50|10\.70|10\.71|11\.00|11\.02|11\.50|11\.51|11\.52|11\.60|11\.70|11\.80|12\.00|12\.50|12\.70|12\.71|12\.72|13\.00)/);
    return m ? m[1] : null;
  }
  function start() {
    var selectors = [
      "#startJailbreak","#start-jailbreak",
      "[data-action='jailbreak']",
      "button[id*='start' i][id*='jailbreak' i]",
      "a[id*='start' i][id*='jailbreak' i]"
    ];
    for (var i=0;i<selectors.length;i++) {
      var e=document.querySelector(selectors[i]);
      if(e && !e.disabled){ try{e.click(); return true;}catch(_){} }
    }
    return false;
  }
  window.FirmwareAutoStart = { firmware: fw(), start: start };
  if(document.readyState==="loading")
    document.addEventListener("DOMContentLoaded",function(){setTimeout(start,300);});
  else setTimeout(start,300);
})();

</script>
</body>
  <script>
// Logging utility
    var outputConsole = document.getElementById("console");
    window.log = function (msg) {
      outputConsole.textContent += msg + "\n";
    };
    // Download progress (% display)
    function DLProgress(e) {
      if (!e || !e.total) return;
      var percent = (Math.round((e.loaded / e.total) * 100));
      window.log("[CACHE] Downloading... " + percent + "% complete.");
    }
    // On cache complete
    function DisplayCacheProgress() {
      window.log(" ");
      window.log("[SUCCESS] Cache berhasil diinstall");
      // setTimeout(function() { window.log("Reloading..."); }, 2000);
      // setTimeout(function() { location.reload(); }, 3000);
      window.log("Tahan tombol PS > Power > Restart PS4.");
    }
    // On error
    function DLError(e) {
      window.log(" ");
      window.log("[CACHE ERROR] An error occured during Cache...");
    }
    // Event listeners
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.addEventListener("error", DLError, false);
    window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
  </script>
<script>
(function(){var a=window.applicationCache;
a.addEventListener("cached",function(){var o=document.getElementById("console");if(o)o.textContent+="[SUCCESS] Offline cache installed.\n";},false);
a.addEventListener("error",function(){var o=document.getElementById("console");if(o)o.textContent+="[CACHE ERROR] Offline cache update failed.\n";},false);
try{if(a.status===a.UNCACHED||a.status===a.IDLE)a.update();}catch(e){}
})();
</script></html>
