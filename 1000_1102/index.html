<script>
    var scriptsLoaded = false;

    function triggerScripts() {
      if (scriptsLoaded) return;
      scriptsLoaded = true;

      var consoleLog = document.getElementById('console');
      if (consoleLog) consoleLog.innerText += "\nLoading main.js & script.js...";

      var s1 = document.createElement('script');
      s1.src = 'src/main.js';
      s1.onerror = function() {
        if (consoleLog) consoleLog.innerText += "\n❌ Error: Gagal memuat src/main.js (Cek path/file)";
      };
      
      s1.onload = function() {
        var s2 = document.createElement('script');
        s2.src = 'includes/script.js';
        s2.onerror = function() {
          if (consoleLog) consoleLog.innerText += "\n❌ Error: Gagal memuat includes/script.js (Cek path/file)";
        };
        document.body.appendChild(s2);
      };

      document.body.appendChild(s1);
    }

    if (window.applicationCache) {
      var appCache = window.applicationCache;
      var consoleLog = document.getElementById('console');

      appCache.addEventListener('progress', function(e) {
        if (e.lengthComputable && consoleLog) {
          var percent = Math.round((e.loaded / e.total) * 100);
          consoleLog.innerText = "Caching offline files... " + percent + "%";
        }
      }, false);

      appCache.addEventListener('cached', function() {
        if (consoleLog) consoleLog.innerText = "Offline cache complete (100%)!";
        triggerScripts();
      }, false);

      appCache.addEventListener('noupdate', function() {
        if (consoleLog) consoleLog.innerText = "Offline cache ready.";
        triggerScripts();
      }, false);

      appCache.addEventListener('error', function() {
        if (consoleLog) consoleLog.innerText = "Cache error/offline mode.";
        triggerScripts();
      }, false);

      setTimeout(function() {
        if (!scriptsLoaded) {
          if (consoleLog) consoleLog.innerText += "\n[Timeout] ...";
          triggerScripts();
        }
      }, 3000);

    } else {
      triggerScripts();
    }
  </script>
<script>

/* Firmware Auto Start dispatcher */
(function () {
  "use strict";
  function fw() {
    var t = (document.body && document.body.innerText) || "";
    var m = t.match(/\b(9\.00|9\.03|9\.04|9\.50|9\.60|10\.00|10\.01|10\.50|10\.70|10\.71|11\.00|11\.02|11\.50|11\.51|11\.52|11\.60|11\.70|11\.80|12\.00|12\.50|12\.70|12\.71|12\.72|13\.00)\b/);
    return m ? m[1] : null;
  }
  function start() {
    var selectors = [
      "#startJailbreak","#start-jailbreak","#start","#jeilbrek",
      "[data-action='jailbreak']",
      "button[id*='start' i][id*='jailbreak' i]",
      "a[id*='start' i][id*='jailbreak' i]"
    ];
    for (var i=0;i<selectors.length;i++) {
      var e=document.querySelector(selectors[i]);
      if(e && !e.disabled){ try{e.click(); return true;}catch(_){} }
    }
    return false;
  }
  window.FirmwareAutoStart = { firmware: fw(), start: start };
  if(document.readyState==="loading")
    document.addEventListener("DOMContentLoaded",function(){setTimeout(start,300);});
  else setTimeout(start,300);
})();

</script>

<div id="real-device-stability"><span class="rds-label">نسبة استقرار جهاز هي</span><span class="rds-value" id="real-device-stability-value">--%</span></div>
<script>
(function(){
'use strict';
var box=document.getElementById('real-device-stability'), val=document.getElementById('real-device-stability-value');
function firmware(){
 var u=navigator.userAgent||'', m=u.match(/PlayStation\s*4[\s\/]+(\d+)\.(\d+)/i);
 if(m) return m[1]+'.'+m[2];
 var t=(document.body&&document.body.innerText)||'', x=t.match(/(?:PS4|PlayStation\s*4)[^0-9]*(\d+\.\d{2})/i);
 return x?x[1]:null;
}
var fw=firmware(); if(!fw) return;
var key='rds-stats-'+fw, stats;
try{stats=JSON.parse(localStorage.getItem(key)||'null')}catch(e){stats=null}
if(!stats||typeof stats.attempts!=='number'||typeof stats.successes!=='number') stats={attempts:0,successes:0};
function pct(){return stats.attempts>0?Math.round(stats.successes*100/stats.attempts):null}
function save(){try{localStorage.setItem(key,JSON.stringify(stats))}catch(e){}}
function show(){var p=pct();if(p===null)return;val.textContent=p+'%';box.style.display='block'}
function successText(){
 var t=((document.body&&document.body.innerText)||'').toLowerCase();
 return /jailbreak complete|jailbreak completed|jailbreak success|achieved jailbreak|already jailbroken|goldhen.*(?:loaded|success)|payload.*(?:loaded|running|success)|kpatched/.test(t);
}
var successSeen=false;
function markSuccess(){if(successSeen)return;successSeen=true;stats.successes++;save();show()}
function markAttempt(){stats.attempts++;save()}
var old=window.jailbreakSuccess;
window.jailbreakSuccess=function(){if(typeof old==='function'){try{old.apply(this,arguments)}catch(e){}}markSuccess()};
var lastClick=0;
function hook(){
 var selectors=['#start','#jeilbrek','#startJailbreak','#start-jailbreak','button[data-action="jailbreak"]','button[id*="jailbreak" i]'];
 for(var i=0;i<selectors.length;i++){var e=document.querySelector(selectors[i]);if(e&&!e.__rds){e.__rds=true;e.addEventListener('click',function(){var now=Date.now();if(now-lastClick<1000)return;lastClick=now;successSeen=false;markAttempt()},true)}}
}
show();hook();
setInterval(function(){hook();if(successText())markSuccess()},250);
try{new MutationObserver(function(){hook();if(successText())markSuccess()}).observe(document.body,{subtree:true,childList:true,characterData:true})}catch(e){}
})();
</script>
