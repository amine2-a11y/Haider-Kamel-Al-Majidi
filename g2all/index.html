<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 HOST • Auto Jailbreak</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="card">
<div class="badge">PS4 • AUTO JAILBREAK</div>
<h1 id="msgs">جاري التعرف على النظام...</h1>
<div class="subtitle" id="sub">يتم اختيار ملف النظام المناسب وتشغيله تلقائياً.</div>
<script>
(function () {
  "use strict";
  const ua = navigator.userAgent;
  const match = ua.match(/PlayStation 4[ \/]([0-9]{1,2}\.[0-9]{2})/i);
  const msgs = document.getElementById("msgs");
  const sub = document.getElementById("sub");

  if (!match) {
    msgs.textContent = "لم يتم التعرف على PS4";
    return;
  }

  const fwVersion = match[1];
  const fw = parseFloat(fwVersion);
  msgs.textContent = "PS4 Firmware " + fwVersion;
  sub.textContent = "جاري بدء المسار المناسب تلقائياً...";

  function load(src, module, after) {
    const s = document.createElement("script");
    if (module) s.type = "module";
    s.src = src;
    s.onerror = function () {
      msgs.textContent = "تعذر تحميل المسار — أعد فتح المتصفح";
      sub.textContent = "Firmware: " + fwVersion;
    };
    if (after) s.onload = after;
    document.head.appendChild(s);
  }

  // Keep the project's existing firmware-specific exploit files unchanged.
  if (fw >= 7.00 && fw <= 8.52) {
    load("700/alert.js", true);
  } else if (fw >= 9.00 && fw <= 9.60) {
    load("900/alert.js", true);
  } else if (fw >= 10.00 && fw <= 11.02) {
    load("css/main.js", false, function () {
      setTimeout(function () {
        if (typeof doJb === "function") doJb();
      }, 300);
    });
  } else if (fw >= 11.50 && fw <= 12.02) {
    load("slopkit/chain_lapse.js", true);
  } else if (fw >= 12.50 && fw <= 13.00) {
    load("slopkit/chain_poops.js", true);
  } else {
    msgs.textContent = "Firmware غير مدعوم: " + fwVersion;
    sub.textContent = "هذا المشروع يحتوي على مسارات من 7.00 إلى 13.00 فقط.";
  }
})();
</script>
</div>
</body>
</html>
