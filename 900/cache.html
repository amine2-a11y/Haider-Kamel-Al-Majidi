<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSFree-Lapse — Installing Cache</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:#020711 url("../background.png") center/cover no-repeat fixed;color:#eaf4ff;font-family:Arial,"Segoe UI",sans-serif}
.wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(560px,90vw);padding:30px 34px;border:1px solid rgba(22,140,255,.45);border-radius:16px;background:rgba(2,9,19,.94);box-shadow:0 0 40px rgba(0,100,255,.16);text-align:center}
.brand{font-size:11px;letter-spacing:.35em;color:#7fa9d0;margin-bottom:10px}
h1{margin:0 0 8px;font-size:22px}h1 b{color:#168cff}
.sub{font-size:11px;color:#8ca4bb;margin-bottom:24px}
.bar{height:14px;border-radius:20px;background:#071321;border:1px solid rgba(70,150,235,.3);overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#075dc4,#168cff);box-shadow:0 0 14px rgba(22,140,255,.7);transition:width .15s}
.percent{font-size:30px;font-weight:700;margin:18px 0 5px;color:#168cff}
.state{font-size:11px;color:#a8bbcc;min-height:16px}
.bytes{font:10px "Courier New",monospace;color:#637f99;margin-top:10px}
</style>
<style id="global-background-fix">
html,body{min-height:100%;margin:0;}
body{background-color:#020711 !important;background-image:url("../background.png") !important;background-size:cover !important;background-position:center center !important;background-repeat:no-repeat !important;background-attachment:fixed !important;}
</style>
<style id="pro-theme">
:root{
  --accent:#20d9ff;
  --accent2:#1680ff;
  --panel:rgba(3,10,28,.72);
  --panel2:rgba(2,7,20,.84);
  --line:rgba(32,217,255,.48);
  --text:#eefaff;
  --muted:#9fc6d9;
}
html,body{min-height:100%;margin:0;}
body{
  color:var(--text)!important;
  background-color:#020714!important;
  background-size:cover!important;
  background-position:center!important;
  background-repeat:no-repeat!important;
  background-attachment:fixed!important;
  font-family:Arial,sans-serif!important;
}
button,input,select{font-family:Arial,sans-serif!important;}
button{
  border:1px solid var(--line)!important;
  border-radius:10px!important;
  background:linear-gradient(180deg,rgba(20,132,255,.28),rgba(3,19,48,.72))!important;
  color:#fff!important;
  box-shadow:0 0 12px rgba(32,217,255,.12),inset 0 0 10px rgba(32,217,255,.06)!important;
  transition:transform .12s,box-shadow .12s!important;
}
button:hover,button:focus{
  transform:translateY(-1px);
  box-shadow:0 0 18px rgba(32,217,255,.28),inset 0 0 12px rgba(32,217,255,.08)!important;
}
h1,h2,h3{color:#f5fdff!important;text-shadow:0 0 10px rgba(32,217,255,.25)!important;}
#console,.console,.log,.output,[id*="console"],[class*="console"]{
  box-sizing:border-box!important;
  background:linear-gradient(180deg,rgba(2,8,24,.78),rgba(1,5,16,.88))!important;
  border:1px solid var(--line)!important;
  border-radius:12px!important;
  box-shadow:0 0 22px rgba(0,0,0,.42),0 0 18px rgba(32,217,255,.10)!important;
  color:#d9f8ff!important;
}
</style>
<style id="user-background">
html,body{min-height:100%!important;margin:0!important}
body{background-color:#020714!important;background-image:url("../background.png")!important;background-size:cover!important;background-position:center center!important;background-repeat:no-repeat!important;background-attachment:fixed!important}
</style>

<style id="small-start-status">
#small-start-status{
 position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
 z-index:2147483646;width:245px;min-height:105px;box-sizing:border-box;
 padding:10px 12px;border:1px solid rgba(32,217,255,.75);
 border-radius:10px;background:rgba(2,7,18,.82);
 box-shadow:0 0 18px rgba(32,217,255,.16),inset 0 0 12px rgba(32,217,255,.05);
 color:#eafcff;font:12px Arial,sans-serif;display:none;
}
#small-start-status .st{font-size:11px;color:#55eaff;margin-bottom:7px}
#small-start-status .row{line-height:18px;color:#ccecf5}
#small-start-status .ok{color:#5cff8a}
</style>
<style id="keep-original-background">html,body{min-height:100%;margin:0}body{background:#020714 url("../background.png") center/cover no-repeat fixed!important}</style><style id="exact-user-background">
html,body{min-height:100%!important;margin:0!important;background:#020714!important;}
body{background-image:url("../background.jpg")!important;background-size:cover!important;background-position:center center!important;background-repeat:no-repeat!important;background-attachment:fixed!important;}
</style></head>
<body>
<div class="wrap"><div class="card">
<div class="brand">PSFREE-LAPSE EXPLOIT</div>
<h1>OFFLINE CACHE <b>9.00</b></h1>
<div class="sub">Installing all required files — please wait</div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="percent" class="percent">0%</div>
<div id="state" class="state">Preparing cache...</div>
<div id="bytes" class="bytes">0 / 0 bytes</div>
</div></div>
<script>
(function(){
'use strict';
var app=window.applicationCache, fill=document.getElementById('fill'),
    percent=document.getElementById('percent'), state=document.getElementById('state'),
    bytes=document.getElementById('bytes'), done=false, last=0;

function setProgress(p,loaded,total){
  p=Math.max(0,Math.min(100,Number(p)||0));
  last=p; fill.style.width=p+'%'; percent.textContent=Math.round(p)+'%';
  if(total>0) bytes.textContent=fmt(loaded)+' / '+fmt(total);
}
function fmt(n){
  n=Number(n)||0;
  if(n<1024) return Math.round(n)+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
function finish(){
  if(done)return; done=true; setProgress(100,1,1);
  state.textContent='Cache installed successfully — opening exploit...';
  setTimeout(function(){location.replace('index.html');},900);
}
function onChecking(){state.textContent='Checking offline cache...';}
function onDownloading(){state.textContent='Downloading cache files...';setProgress(0,0,0);}
function onProgress(e){
  var total=Number(e.total)||0, loaded=Number(e.loaded)||0;
  if(total>0){setProgress(loaded/total*100,loaded,total);}
  else {state.textContent='Installing cache files...'; if(last<95)setProgress(Math.min(95,last+1),0,0);}
}
function onCached(){finish();}
function onUpdateReady(){try{app.swapCache();}catch(e){} finish();}
function onNoUpdate(){state.textContent='Cache already installed.';finish();}
function onError(){state.textContent='Cache error — check the connection and try again.';}

app.addEventListener('checking',onChecking,false);
app.addEventListener('downloading',onDownloading,false);
app.addEventListener('progress',onProgress,false);
app.addEventListener('cached',onCached,false);
app.addEventListener('updateready',onUpdateReady,false);
app.addEventListener('noupdate',onNoUpdate,false);
app.addEventListener('error',onError,false);
app.addEventListener('obsolete',onError,false);

window.addEventListener('load',function(){
  state.textContent='Starting cache installation...';
  setTimeout(function(){
    if(app.status===app.UPDATEREADY || app.status===app.UNCACHED){try{app.update();}catch(e){}}
    else if(app.status===app.IDLE){state.textContent='Cache ready.';setProgress(100,1,1);setTimeout(function(){location.replace('index.html')},700);}
  },80);
},false);
})();
</script>


<div id="small-start-status" aria-hidden="true">
  <div class="st">STATUS: <span>READY</span></div>
  <div class="row">[+] Init</div>
  <div class="row">[+] Patch</div>
  <div class="row">[+] Payload</div>
  <div class="row ok">✓ Done!</div>
</div>
</body>
</html>
