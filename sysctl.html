<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 sysctl / psid</title>
<style>

  * { box-sizing:border-box; }
  html, body {
    margin:0; padding:0; min-height:100vh; overflow:hidden;
    background:#05070c; color:#e7edf6;
    font:15px/1.45 "Segoe UI", Tahoma, system-ui, sans-serif;
  }
  body {
    position:relative;
    background-image:url('preview.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  body::before {
    content:""; position:fixed; inset:0;
    background:rgba(0,0,0,.10);
    pointer-events:none; z-index:0;
  }
  #wrap {
    position:relative; z-index:1;
    width:min(720px, 76vw);
    margin:8vh auto 0;
    padding:14px 16px;
    background:rgba(5,9,16,.42);
    border:1px solid rgba(130,190,255,.35);
    border-radius:16px;
    box-shadow:0 10px 35px rgba(0,0,0,.35), inset 0 0 22px rgba(80,150,255,.06);
  }
  #brand {
    text-align:center; padding:5px 8px 8px;
    background:transparent; border:0;
  }
  #brand b { font-size:13px; font-weight:700; letter-spacing:.10em; color:#eef5ff; }
  #state {
    font-size:18px; font-weight:700; margin:0 0 8px;
    color:#f0f6ff; text-shadow:0 0 10px rgba(100,180,255,.65);
  }
  #out {
    white-space:pre-wrap; font:11px/1.4 Consolas,monospace;
    background:rgba(3,7,13,.30);
    border:1px solid rgba(140,190,255,.20);
    border-radius:10px; padding:8px 10px;
    height:min(42vh, 330px); overflow-y:auto;
  }
  .ok { color:#9be8b8; } .bad { color:#ffaaa0; } .warn { color:#ffe19a; }
</style>
</head>
<body>
<div id="wrap">
  <div id="state">loading...</div>
  <p class="sub"><b>DRY.</b> WebKit primitive and syscalls only &mdash; no aio,
     no netcontrol, no double free, nothing armed. It reads sysctls and puts
     <code>Math.expm1</code> back. Safe to run as often as you like; no reboot.</p>
  <div id="out"></div>
</div>
<script type="module">import "./sysctl.js";</script>
</body>
</html>
